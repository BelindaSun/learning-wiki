<svg viewBox="0 0 1360 800" xmlns="http://www.w3.org/2000/svg" font-family="&#39;Source Serif 4&#39;,&#39;Songti SC&#39;,&#39;Noto Serif SC&#39;,Georgia,serif">
  <rect x="0" y="0" width="1360" height="800" fill="#f7f3ea"></rect>
  <defs>
    <linearGradient id="horizon" x1="90" y1="0" x2="1330" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(43,39,36,0.42)"></stop>
      <stop offset="1" stop-color="#b5541c"></stop>
    </linearGradient>
  </defs>

  <text x="680" y="42" text-anchor="middle" font-weight="600" font-size="26" fill="#2b2724">从硅到 AI · From Silicon to AI</text>
  <text x="680" y="65" text-anchor="middle" font-size="13.5" fill="rgba(43,39,36,0.68)">物质 → 计算 → 基础设施 → 智能</text>

  <line x1="90" y1="172" x2="1330" y2="172" stroke="url(#horizon)" stroke-width="1.5"></line>
  <circle cx="90" cy="172" r="3.5" fill="rgba(43,39,36,0.42)"></circle>
  <circle cx="400" cy="172" r="3.5" fill="#8a6a45"></circle>
  <circle cx="830" cy="172" r="3.5" fill="#ac5a22"></circle>
  <circle cx="1130" cy="172" r="4" fill="#b5541c"></circle>

  <text x="90" y="150" font-size="11.5" letter-spacing="1.2" fill="rgba(43,39,36,0.42)">01 · MATTER</text>
  <text x="400" y="150" font-size="11.5" letter-spacing="1.2" fill="rgba(43,39,36,0.42)">02 · COMPUTATION</text>
  <text x="830" y="150" font-size="11.5" letter-spacing="1.2" fill="rgba(43,39,36,0.42)">03 · INFRASTRUCTURE</text>
  <text x="1130" y="150" font-size="11.5" letter-spacing="1.2" fill="rgba(43,39,36,0.42)">04 · INTELLIGENCE</text>

  <path d="M560,222 C660,98 760,92 860,96 C960,100 1060,138 1150,222" fill="none" stroke="#b5541c" stroke-width="1.3" opacity="0.75"></path>
  <line x1="560" y1="212" x2="560" y2="224" stroke="#b5541c" stroke-width="1.3" opacity="0.75"></line>
  <line x1="1150" y1="212" x2="1150" y2="224" stroke="#b5541c" stroke-width="1.3" opacity="0.75"></line>
  <text x="855" y="88" text-anchor="middle" font-weight="700" font-size="12.5" fill="#b5541c">软件栈 · Software stack</text>
  <text x="605" y="120" font-size="10.5" fill="rgba(43,39,36,0.68)">编译器 → CUDA/Kernel</text>
  <text x="1105" y="120" text-anchor="end" font-size="10.5" fill="rgba(43,39,36,0.68)">ML 编译器 → 推理引擎</text>

  <text x="90" y="248" font-weight="600" font-size="20" fill="#2b2724">硅 / 晶体管</text>
  <text x="90" y="270" font-size="12" fill="rgba(43,39,36,0.68)">Silicon / Transistor</text>
  <text x="90" y="308" font-weight="600" font-size="20" fill="#2b2724">芯片</text>
  <text x="90" y="330" font-size="12" fill="rgba(43,39,36,0.68)">Chip</text>
  <text x="90" y="368" font-weight="600" font-size="18" fill="#2b2724">半导体供应链</text>
  <text x="90" y="388" font-size="12" fill="rgba(43,39,36,0.68)">Semiconductor supply</text>
  <text x="90" y="414" font-size="13" fill="#2b2724">晶圆 → 裸片 → 良率</text>
  <text x="90" y="433" font-size="13" fill="#2b2724">→ 制程 → 先进封装</text>
  <text x="90" y="456" font-style="italic" font-size="11.5" fill="rgba(43,39,36,0.42)">造出底层的硅与芯片</text>

  <!-- Computing-system group: wraps processor + memory + interconnect + compute so they read as one unit, not sequential layers -->
  <rect x="352" y="204" width="300" height="284" rx="18" fill="rgba(181,84,28,0.045)" stroke="rgba(181,84,28,0.35)" stroke-width="1.2"></rect>
  <text x="372" y="227" font-size="10.5" letter-spacing="1.1" fill="#b5541c">计算系统 · COMPUTING SYSTEM</text>

  <text x="400" y="252" font-weight="600" font-size="24" fill="#2b2724">处理器</text>
  <text x="400" y="276" font-size="12" fill="rgba(43,39,36,0.68)">Processor</text>

  <path d="M424,308 C450,334 468,352 480,366" fill="none" stroke="rgba(43,39,36,0.42)" stroke-width="1"></path>
  <path d="M596,308 C568,334 548,352 534,366" fill="none" stroke="rgba(43,39,36,0.42)" stroke-width="1"></path>
  <text x="410" y="310" font-size="16" fill="#2b2724">内存</text>
  <text x="410" y="328" font-size="10.5" fill="rgba(43,39,36,0.68)">Memory</text>
  <text x="600" y="310" text-anchor="end" font-size="16" fill="#2b2724">互连</text>
  <text x="600" y="328" text-anchor="end" font-size="10.5" fill="rgba(43,39,36,0.68)">Interconnect</text>
  <text x="500" y="386" text-anchor="middle" font-weight="700" font-style="italic" font-size="27" fill="#8a3f14">算力</text>
  <text x="500" y="408" text-anchor="middle" font-size="12" fill="rgba(43,39,36,0.68)">Compute — 处理器的能力</text>

  <text x="400" y="452" font-style="italic" font-size="12" fill="rgba(43,39,36,0.42)">计算系统＝处理器＋内存＋互连</text>
  <text x="400" y="470" font-style="italic" font-size="12" fill="rgba(43,39,36,0.42)">协同运作，AI 不只靠算力</text>

  <text x="830" y="248" font-weight="600" font-size="20" fill="#2b2724">服务器</text>
  <text x="830" y="270" font-size="12" fill="rgba(43,39,36,0.68)">Server</text>
  <text x="830" y="308" font-weight="600" font-size="20" fill="#2b2724">集群</text>
  <text x="830" y="330" font-size="12" fill="rgba(43,39,36,0.68)">Cluster</text>
  <text x="830" y="368" font-weight="600" font-size="20" fill="#2b2724">数据中心</text>
  <text x="830" y="390" font-size="12" fill="rgba(43,39,36,0.68)">Datacenter（+ 供电 / 散热）</text>

  <text x="1130" y="248" font-weight="600" font-size="20" fill="#2b2724">训练 / 推理</text>
  <text x="1130" y="270" font-size="12" fill="rgba(43,39,36,0.68)">Training / Inference</text>
  <text x="1130" y="336" font-weight="700" font-size="38" fill="#2b2724">AI 产品</text>
  <text x="1130" y="366" font-size="13.5" fill="rgba(43,39,36,0.68)">AI Product</text>
  <text x="1130" y="386" font-size="11.5" fill="rgba(43,39,36,0.42)">ChatGPT · Coding Agents · AI Assistants</text>
</svg>
