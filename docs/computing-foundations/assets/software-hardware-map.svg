<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Source Serif 4','Songti SC','Noto Serif SC',Georgia,serif">
  <rect x="0" y="0" width="1000" height="1000" fill="#f7f3ea"></rect>

  <text x="500" y="42" text-anchor="middle" font-weight="600" font-size="26" fill="#2b2724">Software × Hardware Map · 软硬之间的桥</text>
  <text x="500" y="66" text-anchor="middle" font-size="13" fill="rgba(43,39,36,0.68)">定位：模型是"软件"，GPU 是"硬件"，中间到底发生了什么</text>

  <!-- ZONE 1: software world (recap from Map 1) -->
  <rect x="60" y="92" width="880" height="30" fill="rgba(43,39,36,0.03)"></rect>
  <text x="90" y="112" font-size="11" letter-spacing="1" fill="rgba(43,39,36,0.42)">SOFTWARE WORLD · 见 Map 1</text>

  <rect x="230" y="132" width="540" height="66" rx="10" fill="none" stroke="rgba(43,39,36,0.35)" stroke-width="1.2"></rect>
  <text x="500" y="160" text-anchor="middle" font-size="17" font-weight="600" fill="#2b2724">AI workload / 模型</text>
  <text x="500" y="182" text-anchor="middle" font-size="11.5" fill="rgba(43,39,36,0.6)">应用代码怎么表达这次要做的事</text>

  <line x1="500" y1="198" x2="500" y2="222" stroke="rgba(43,39,36,0.42)" stroke-width="1.2"></line>

  <!-- ZONE 2: the bridge (new content) -->
  <rect x="60" y="222" width="880" height="30" fill="rgba(181,84,28,0.06)"></rect>
  <text x="90" y="242" font-size="11" letter-spacing="1" fill="#b5541c">THE BRIDGE · 这张图的新内容</text>

  <rect x="300" y="262" width="400" height="64" rx="10" fill="rgba(181,84,28,0.06)" stroke="#b5541c" stroke-width="1.2"></rect>
  <text x="500" y="288" text-anchor="middle" font-size="17" font-weight="700" fill="#8a3f14">Compiler · 编译器</text>
  <text x="500" y="308" text-anchor="middle" font-size="11.5" fill="rgba(43,39,36,0.62)">把表达的工作，翻成硬件能懂的指令</text>

  <line x1="500" y1="326" x2="500" y2="346" stroke="rgba(43,39,36,0.42)" stroke-width="1.2"></line>

  <rect x="300" y="346" width="400" height="64" rx="10" fill="rgba(181,84,28,0.06)" stroke="#b5541c" stroke-width="1.2"></rect>
  <text x="500" y="372" text-anchor="middle" font-size="17" font-weight="700" fill="#8a3f14">Kernel / Library · 内核 / 库</text>
  <text x="500" y="392" text-anchor="middle" font-size="11.5" fill="rgba(43,39,36,0.62)">为某个硬件、某个操作，写到极致快的小程序</text>
  <text x="500" y="404" text-anchor="middle" font-size="10.5" font-style="italic" fill="rgba(43,39,36,0.42)">cuBLAS / cuDNN 住在这一层；CUDA 是更大的平台生态</text>

  <line x1="500" y1="410" x2="500" y2="430" stroke="rgba(43,39,36,0.42)" stroke-width="1.2"></line>

  <rect x="270" y="430" width="460" height="64" rx="10" fill="rgba(181,84,28,0.1)" stroke="#b5541c" stroke-width="1.6"></rect>
  <text x="500" y="456" text-anchor="middle" font-size="18" font-weight="700" fill="#8a3f14">Runtime · 运行时（回顾 Map 1）</text>
  <text x="500" y="478" text-anchor="middle" font-size="11.5" fill="rgba(43,39,36,0.62)">真正的现场指挥——决定接下来这一刻实际发生什么</text>

  <line x1="500" y1="494" x2="500" y2="516" stroke="rgba(43,39,36,0.42)" stroke-width="1.2"></line>
  <text x="500" y="534" text-anchor="middle" font-size="12" fill="rgba(43,39,36,0.55)">Runtime 同时要拿主意的四件事：</text>

  <!-- Four sibling decisions -->
  <g font-size="12.5">
    <rect x="60" y="552" width="205" height="92" rx="10" fill="rgba(181,84,28,0.045)" stroke="rgba(181,84,28,0.35)"></rect>
    <text x="162" y="578" text-anchor="middle" font-weight="700" fill="#8a3f14">Scheduling</text>
    <text x="162" y="596" text-anchor="middle" font-size="11" fill="rgba(43,39,36,0.62)">调度</text>
    <text x="162" y="616" text-anchor="middle" font-size="11" fill="rgba(43,39,36,0.62)">什么任务</text>
    <text x="162" y="632" text-anchor="middle" font-size="11" fill="rgba(43,39,36,0.62)">现在 / 稍后跑</text>

    <rect x="277" y="552" width="205" height="92" rx="10" fill="rgba(181,84,28,0.045)" stroke="rgba(181,84,28,0.35)"></rect>
    <text x="379" y="578" text-anchor="middle" font-weight="700" fill="#8a3f14">Batching</text>
    <text x="379" y="596" text-anchor="middle" font-size="11" fill="rgba(43,39,36,0.62)">批处理</text>
    <text x="379" y="616" text-anchor="middle" font-size="11" fill="rgba(43,39,36,0.62)">凑一批一起</text>
    <text x="379" y="632" text-anchor="middle" font-size="11" fill="rgba(43,39,36,0.62)">算，更划算</text>

    <rect x="494" y="552" width="205" height="92" rx="10" fill="rgba(181,84,28,0.045)" stroke="rgba(181,84,28,0.35)"></rect>
    <text x="596" y="578" text-anchor="middle" font-weight="700" fill="#8a3f14">Precision</text>
    <text x="596" y="596" text-anchor="middle" font-size="11" fill="rgba(43,39,36,0.62)">精度</text>
    <text x="596" y="616" text-anchor="middle" font-size="11" fill="rgba(43,39,36,0.62)">数字多精确，</text>
    <text x="596" y="632" text-anchor="middle" font-size="11" fill="rgba(43,39,36,0.62)">换多少速度</text>

    <rect x="711" y="552" width="229" height="92" rx="10" fill="rgba(181,84,28,0.045)" stroke="rgba(181,84,28,0.35)"></rect>
    <text x="825" y="578" text-anchor="middle" font-weight="700" fill="#8a3f14">Memory mgmt</text>
    <text x="825" y="596" text-anchor="middle" font-size="11" fill="rgba(43,39,36,0.62)">内存管理</text>
    <text x="825" y="616" text-anchor="middle" font-size="11" fill="rgba(43,39,36,0.62)">谁放快内存，</text>
    <text x="825" y="632" text-anchor="middle" font-size="11" fill="rgba(43,39,36,0.62)">谁放慢内存</text>
  </g>

  <!-- Converge back to center, down to hardware -->
  <path d="M162,644 C162,690 460,700 495,716" fill="none" stroke="rgba(43,39,36,0.42)" stroke-width="1"></path>
  <path d="M379,644 C379,680 470,700 497,716" fill="none" stroke="rgba(43,39,36,0.42)" stroke-width="1"></path>
  <path d="M596,644 C596,680 530,700 503,716" fill="none" stroke="rgba(43,39,36,0.42)" stroke-width="1"></path>
  <path d="M825,644 C825,690 540,700 505,716" fill="none" stroke="rgba(43,39,36,0.42)" stroke-width="1"></path>

  <!-- ZONE 3: hardware world (recap from Map 2) -->
  <rect x="60" y="726" width="880" height="30" fill="rgba(43,39,36,0.03)"></rect>
  <text x="90" y="746" font-size="11" letter-spacing="1" fill="rgba(43,39,36,0.42)">HARDWARE WORLD · 见 Map 2</text>

  <rect x="230" y="766" width="540" height="70" rx="10" fill="none" stroke="rgba(43,39,36,0.35)" stroke-width="1.2"></rect>
  <text x="500" y="796" text-anchor="middle" font-size="18" font-weight="600" fill="#2b2724">算力 + 内存 + 互连</text>
  <text x="500" y="818" text-anchor="middle" font-size="12" fill="rgba(43,39,36,0.6)">Compute + Memory + Interconnect → 物理执行</text>

  <text x="500" y="872" text-anchor="middle" font-size="13" font-style="italic" fill="rgba(43,39,36,0.5)">没有什么是"直接"运行的——先翻译，再编译，再调度，才落到硬件上</text>

  <!-- Pointers down to future Spines -->
  <text x="500" y="916" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a3f14">CUDA 为什么是护城河？编译器怎么优化？→ 软硬桥脊 Bridge Spine（Later）</text>
  <text x="500" y="938" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a3f14">精度怎么换速度、内存怎么分层？→ 算力脊 / 内存脊（Later）</text>
</svg>
