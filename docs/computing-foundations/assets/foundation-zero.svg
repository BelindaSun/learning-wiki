<svg viewBox="0 0 960 780" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <text x="480" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Foundation Zero · 地基第 0 层</text>
  <text x="480" y="62" text-anchor="middle" font-size="12" fill="#64748B">进五主脊之前，先认识 5 组最基本的"原子"（一句话 + 一个心智图像）</text>

  <text x="62" y="94" font-size="10" fill="#94A3B8">概念组</text>
  <text x="332" y="94" font-size="10" fill="#94A3B8">一句话区分</text>
  <text x="662" y="94" font-size="10" fill="#94A3B8">心智图像</text>

  <!-- Card 1 -->
  <rect x="40" y="104" width="880" height="104" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="62" y="150" font-size="17" font-weight="700" fill="#0F172A">硬件 / 软件</text>
  <text x="62" y="172" font-size="11" fill="#64748B">Hardware / Software</text>
  <text x="332" y="162" font-size="14" fill="#334155">硬件 = 摸得到的机器；软件 = 让它做事的指令</text>
  <text x="662" y="162" font-size="13" font-style="italic" fill="#475569">硬件是乐器，软件是乐谱</text>

  <!-- Card 2 -->
  <rect x="40" y="222" width="880" height="104" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="62" y="268" font-size="17" font-weight="700" fill="#0F172A">CPU / 内存 / 存储</text>
  <text x="62" y="290" font-size="11" fill="#64748B">CPU / Memory / Storage</text>
  <text x="332" y="280" font-size="14" fill="#334155">CPU 干活；内存 手边正在用；存储 收着的</text>
  <text x="662" y="280" font-size="13" font-style="italic" fill="#475569">工人 / 书桌 / 书架</text>

  <!-- Card 3 -->
  <rect x="40" y="340" width="880" height="104" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="62" y="386" font-size="17" font-weight="700" fill="#0F172A">代码 / 程序 / 进程 / OS</text>
  <text x="62" y="408" font-size="11" fill="#64748B">Code / Program / Process / OS</text>
  <text x="332" y="398" font-size="14" fill="#334155">指令 → 打包成一套 → 正在跑的那份 → 总管</text>
  <text x="662" y="398" font-size="13" font-style="italic" fill="#475569">菜谱 / 菜谱本 / 正做的菜 / 厨房主管</text>

  <!-- Card 4 (client/server order fixed) -->
  <rect x="40" y="458" width="880" height="104" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="62" y="504" font-size="17" font-weight="700" fill="#0F172A">客户端 / 服务器 / 网络 / API</text>
  <text x="62" y="526" font-size="11" fill="#64748B">Client / Server / Network / API</text>
  <text x="332" y="516" font-size="14" fill="#334155">提出请求 / 处理并响应 / 负责传递 / 规定怎么请求</text>
  <text x="662" y="516" font-size="13" font-style="italic" fill="#475569">按菜单点单，餐厅做、服务员送</text>

  <!-- Card 5 (no highlight; small forward-flag only) -->
  <rect x="40" y="576" width="880" height="104" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="62" y="622" font-size="17" font-weight="700" fill="#0F172A">核 / 并行 / GPU</text>
  <text x="62" y="644" font-size="11" fill="#64748B">Core / Parallelism / GPU</text>
  <text x="332" y="634" font-size="14" fill="#334155">一个干活单元 → 很多核同时干 → 做到极致</text>
  <text x="662" y="634" font-size="13" font-style="italic" fill="#475569">一个厨师 → 一排同时炒 → 中央厨房 *</text>

  <text x="40" y="712" font-size="11" fill="#94A3B8">* 入门近似；后面讲 CPU vs GPU 时会升级（GPU 不只是"核更多"）。</text>
</svg>
